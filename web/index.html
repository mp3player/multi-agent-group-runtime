<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MAS Group Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="mark">M</div>
          <div>
            <h1>MAS</h1>
            <p id="groupName">Group</p>
          </div>
        </div>
        <section class="side-section members-section">
          <div class="section-head">
            <div class="section-title">Members</div>
            <span class="section-note">runtime</span>
          </div>
          <div id="members" class="members"></div>
          <form id="memberForm" class="member-form">
            <input id="memberName" type="text" placeholder="Name" autocomplete="off" />
            <input
              id="memberDescription"
              type="text"
              placeholder="Role / description"
              autocomplete="off"
            />
            <input id="memberUrl" type="url" placeholder="Base URL (optional)" autocomplete="off" />
            <input id="memberModel" type="text" placeholder="Model (optional)" autocomplete="off" />
            <input
              id="memberKey"
              type="password"
              placeholder="API key (optional)"
              autocomplete="new-password"
            />
            <button id="addMemberBtn" type="submit">Add Member</button>
          </form>
        </section>
        <section class="side-section">
          <div class="section-head">
            <div class="section-title">Controls</div>
            <span class="section-note">session</span>
          </div>
          <div class="button-row">
            <button id="clearBtn" type="button">Clear</button>
            <button id="newBtn" type="button">New</button>
          </div>
          <label class="toggle">
            <input id="showPass" type="checkbox" checked />
            <span>Show PASS / debug</span>
          </label>
        </section>
      </aside>

      <section class="chat">
        <header class="topbar">
          <div>
            <div class="eyebrow">Event-driven group runtime</div>
            <div class="title-row">
              <h2>Group Chat</h2>
              <span id="statusText" class="status">Connecting...</span>
            </div>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <form id="chatForm" class="composer">
          <div class="input-wrap">
            <textarea
              id="messageInput"
              rows="3"
              placeholder="Enter a task, for example: build a JS arcade game under /home/coder/test."
            ></textarea>
            <div class="hint">Enter to send, Shift + Enter for a new line</div>
          </div>
          <button id="sendBtn" type="submit">Send</button>
        </form>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
